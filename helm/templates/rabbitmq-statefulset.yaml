{{- if .Values.rabbitmq.enabled -}}
{{- $fullname := include "ai-kbs.fullname" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-rabbitmq
  labels:
    {{- include "ai-kbs.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.rabbitmq.auth.existingSecret }}
  {{- else }}
  RABBITMQ_DEFAULT_PASS: {{ .Values.rabbitmq.auth.password | default (randAlphaNum 32) | quote }}
  {{- end }}
  RABBITMQ_DEFAULT_USER: {{ .Values.rabbitmq.auth.username | quote }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}-rabbitmq
  labels:
    {{- include "ai-kbs.labels" . | nindent 4 }}
spec:
  serviceName: {{ $fullname }}-rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $fullname }}-rabbitmq
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $fullname }}-rabbitmq
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: ai-kbs
    spec:
      containers:
        - name: rabbitmq
          image: "{{ .Values.rabbitmq.image.repository }}:{{ .Values.rabbitmq.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          envFrom:
            - secretRef:
                name: {{ $fullname }}-rabbitmq
          resources:
            requests: {cpu: "250m", memory: "256Mi"}
            limits:   {cpu: "2",    memory: "1Gi"}
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $fullname }}-rabbitmq-data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.rabbitmq.persistence.size }}
        {{- with .Values.global.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-rabbitmq
  labels:
    {{- include "ai-kbs.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
    - name: management
      port: 15672
      targetPort: management
  selector:
    app.kubernetes.io/name: {{ $fullname }}-rabbitmq
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
