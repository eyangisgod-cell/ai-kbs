{{- if .Values.docreader.enabled -}}
{{- $fullname := include "ai-kbs.fullname" . -}}
{{- $component := "docreader" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-{{ $component }}
  labels:
    {{- include "ai-kbs.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  replicas: {{ .Values.docreader.replicaCount }}
  selector:
    matchLabels:
      {{- include "ai-kbs.componentSelector" (dict "ctx" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ai-kbs.componentLabels" (dict "ctx" . "component" $component) | nindent 8 }}
    spec:
      {{- with .Values.serviceAccount.name }}
      serviceAccountName: {{ . }}
      {{- end }}
      containers:
        - name: {{ $component }}
          image: {{ include "ai-kbs.image" (dict "image" .Values.docreader.image "global" .Values.global) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: grpc
              containerPort: {{ .Values.docreader.service.port }}
          resources:
            {{- toYaml .Values.docreader.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-{{ $component }}
  labels:
    {{- include "ai-kbs.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  type: {{ .Values.docreader.service.type }}
  ports:
    - name: grpc
      port: {{ .Values.docreader.service.port }}
      targetPort: grpc
  selector:
    {{- include "ai-kbs.componentSelector" (dict "ctx" . "component" $component) | nindent 4 }}
{{- end }}
