{{- if .Values.ingress.enabled -}}
{{- $fullname := include "ai-kbs.fullname" . -}}
{{- $ingressClassName := .Values.ingress.className -}}
{{- range .Values.ingress.hosts }}
{{- $host := .host -}}
{{- range .paths }}
{{- $svcName := printf "%s-%s" $fullname .service -}}
{{- $svcPort := .port -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}-{{ .service }}-{{ $svcPort }}
  labels:
    {{- include "ai-kbs.labels" $ | nindent 4 }}
  {{- with $.Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if $ingressClassName }}
  ingressClassName: {{ $ingressClassName }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: {{ .path }}
            pathType: Prefix
            backend:
              service:
                name: {{ $svcName }}
                port:
                  number: {{ $svcPort }}
---
{{- end }}
{{- end }}
{{- if .Values.ingress.tls }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}-tls
  labels:
    {{- include "ai-kbs.labels" . | nindent 4 }}
spec:
  {{- if $ingressClassName }}
  ingressClassName: {{ $ingressClassName }}
  {{- end }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
        {{- range .paths }}
          - path: {{ .path }}
            pathType: Prefix
            backend:
              service:
                name: {{ printf "%s-%s" $fullname .service }}
                port:
                  number: {{ .port }}
        {{- end }}
    {{- end }}
{{- end }}
{{- end }}
