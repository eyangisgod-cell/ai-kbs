{{- if .Values.elasticsearch.enabled -}}
{{- $fullname := include "ai-kbs.fullname" . -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}-elasticsearch
  labels:
    {{- include "ai-kbs.labels" . | nindent 4 }}
spec:
  serviceName: {{ $fullname }}-elasticsearch
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $fullname }}-elasticsearch
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $fullname }}-elasticsearch
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: ai-kbs
    spec:
      containers:
        - name: elasticsearch
          image: "{{ .Values.elasticsearch.image.repository }}:{{ .Values.elasticsearch.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 9200
          env:
            - name: discovery.type
              value: "single-node"
            - name: xpack.security.enabled
              value: "false"
            - name: ES_JAVA_OPTS
              value: {{ .Values.elasticsearch.esJavaOpts | quote }}
          resources:
            {{- toYaml .Values.elasticsearch.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $fullname }}-elasticsearch-data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.elasticsearch.persistence.size }}
        {{- with .Values.global.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-elasticsearch
  labels:
    {{- include "ai-kbs.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 9200
      targetPort: http
  selector:
    app.kubernetes.io/name: {{ $fullname }}-elasticsearch
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
