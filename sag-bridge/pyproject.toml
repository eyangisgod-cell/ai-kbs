# AI-KBS SAG bridge — Python project metadata
#
# Generates a workspace marker so `make lint` (T0.9) and external tooling
# (uv, pip-tools, ruff, mypy) recognize this directory as a Python package.
# Real dependencies (FastAPI, LanceDB, lancedb, sentence-transformers, etc.)
# land in T1.x; T0.5 only needs the [tool.ruff] config block to satisfy the
# lint acceptance criterion in implement.md.

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-kbs-sag-bridge"
version = "0.1.0"
description = "AI-KBS Structure-Aware Graph retrieval bridge"
readme = "../README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "AI-KBS Authors" }]
# Dependencies land in T1.x; T0.5 only configures tooling.
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["sag_bridge*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["sag_bridge"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true