# AI-KBS lint pipeline
# T0.2 deliverable: runs on every PR + push to protected branches.
#
# Three independent jobs so a single linter failure does not cancel the rest:
#   - go        -> golangci-lint v2 on backend/ (uses backend/.golangci.yml)
#   - python    -> ruff on docreader/, mcp-server/, sag-bridge/ (per-module pyproject.toml)
#   - frontend  -> eslint + tsc --noEmit on frontend/ (skipped cleanly if absent)
#
# Each job's `if: hashFiles(...)` guard ensures the job is skipped (not failed)
# when its module is removed in a refactor. v1 ships all four modules, but
# this keeps the workflow robust during the T1.x / T2.x transitions.

name: Lint

on:
  pull_request:
    branches: [main, require]
  push:
    branches: [main, require]

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: golangci-lint (backend/)
    # Skip when backend/ has been removed (defensive; T1.x forks may move it).
    if: hashFiles('backend/go.mod') != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum

      # golangci-lint v2.x matches the `version: "2"` schema in backend/.golangci.yml.
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          # v2.x binary matches the `version: "2"` schema in backend/.golangci.yml.
          # v1.x binaries cannot parse v2 schema configs.
          version: v2.1.0
          working-directory: backend
          args: --timeout 5m
          cache: true
          cache-key: golangci-lint-${{ runner.os }}-${{ hashFiles('backend/.golangci.yml', 'backend/go.sum') }}

  python:
    name: ruff (python services)
    # Skip only when ALL three modules are absent. v1 ships all three.
    if: |
      hashFiles('docreader/pyproject.toml') != '' ||
      hashFiles('mcp-server/pyproject.toml') != '' ||
      hashFiles('sag-bridge/pyproject.toml') != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pipx install ruff==0.6.9 || pip install --user ruff==0.6.9
        shell: bash

      # Each module ships its own [tool.ruff] config (see T0.5). Run them
      # independently so one module's failure does not mask the others.
      - name: Ruff check docreader/
        if: hashFiles('docreader/pyproject.toml') != ''
        working-directory: docreader
        run: ruff check .

      - name: Ruff check mcp-server/
        if: hashFiles('mcp-server/pyproject.toml') != ''
        working-directory: mcp-server
        run: ruff check .

      - name: Ruff check sag-bridge/
        if: hashFiles('sag-bridge/pyproject.toml') != ''
        working-directory: sag-bridge
        run: ruff check .

  frontend:
    name: eslint + tsc (frontend/)
    # Skip cleanly when frontend/ is absent OR the pnpm lockfile has not yet
    # been generated (T1.22 milestone). The package.json exists from T0.10
    # but pnpm install --frozen-lockfile requires pnpm-lock.yaml, which is
    # only added when T1.22 wires up the frontend workspace. Until then, the
    # job is skipped (not failed) so PR feedback stays green.
    if: |
      hashFiles('frontend/package.json') != '' &&
      hashFiles('frontend/pnpm-lock.yaml') != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # frontend/ uses pnpm (per pnpm-workspace.yaml at frontend root).
      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # Cache pnpm store keyed by lockfile so install is fast on repeat runs.
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # Frontend scaffold lands in T1.22. Until eslint config is fully wired
      # up, treat these steps as advisory (T1.22 will harden them).
      - name: ESLint
        id: eslint
        working-directory: frontend
        continue-on-error: true
        run: pnpm exec eslint . --max-warnings 0

      - name: TypeScript type-check
        id: tsc
        working-directory: frontend
        continue-on-error: true
        run: pnpm exec vue-tsc --noEmit