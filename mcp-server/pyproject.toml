# AI-KBS MCP server — Python project metadata
#
# Generates a workspace marker so `make lint` (T0.9) and external tooling
# (uv, pip-tools, ruff, mypy) recognize this directory as a Python package.
# Real dependencies (FastMCP, httpx, oauthlib, etc.) are listed under
# [project] in T1.x; T0.5 only needs the [tool.ruff] config block to satisfy
# the lint acceptance criterion in implement.md.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-kbs-mcp-server"
version = "0.1.0"
description = "AI-KBS Model Context Protocol server"
readme = "../README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "AI-KBS Authors" }]
# Dependencies land in T1.x; T0.5 only configures tooling.
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_kbs_mcp*"]
exclude = ["tests*"]

[tool.ruff]
# AI-KBS Python line-length policy matches Go (120).
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Subset of defaults tuned for an early-stage codebase.
# E/F = pycodestyle/pyflakes; I = isort; B = bugbear; UP = pyupgrade;
# SIM = simplify; RUF = ruff-specific.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# E501 (line-too-long) is enforced by the formatter; double-checking is noisy.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ai_kbs_mcp"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true